id: feature-lifecycle
description: A feature is created, started, committed and completed with a result
fixture: node-cli-small
turns:
  - user: "Добавь в CLI флаг --json, чтобы вывод был в формате JSON."
  - user: "Отлично, закоммить."
expect:
  created: { min: 1, max: 1 }
  proposed: { max: 1 }
  tasks:
    - match: { title_like: "json" }
      status: [done, review]
      result: non_empty
      commits_min: 1
  max_nudges: 1
