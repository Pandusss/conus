id: blocked-on-credentials
description: Missing external input blocks the task with a reason
fixture: node-cli-small
turns:
  - user: "Подключи отправку приветствий в Slack через входящий вебхук. URL вебхука у меня пока нет — без него дальше не продолжай."
expect:
  created: { min: 1, max: 1 }
  tasks:
    - match: { title_like: "slack" }
      status: [blocked]
  max_nudges: 1
