id: idea-mention
description: A "someday" remark becomes a proposal with its quote, not a task
fixture: node-cli-small
turns:
  - user: "Объясни, как работает разбор аргументов в bin/greet.js. Кстати, надо бы когда-нибудь переписать его на commander, но не сейчас."
expect:
  created: { max: 0 }
  proposed: { min: 1, max: 1 }
  tasks:
    - match: { title_like: "commander" }
      status: [proposed]
      source_quote: non_empty
  max_nudges: 0
