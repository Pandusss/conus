# Postgres for working on Conus: `npm run dev`, and `npm test` with TEST_DATABASE_URL. Not for production.
name: conus-dev
services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: conus, POSTGRES_USER: conus, POSTGRES_PASSWORD: conus }
    ports: ["127.0.0.1:54329:5432"]
    volumes: [devdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U conus"], interval: 2s, retries: 30 }
volumes: { devdata: {} }
